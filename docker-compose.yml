services:
  database:
    image: postgres:17-alpine
    container_name: condominio_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WhatsApp (Evolution API): conecta um número pelo QR code e avisa o backend
  # a cada mensagem (webhook). Usa o mesmo Postgres, no schema "evolution".
  whatsapp:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: condominio_whatsapp
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: condominio
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_instances:
